[package]
name = "memora-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "MCP stdio server for the Memora memory engine"
publish = false

[[bin]]
name = "memora-mcp"
path = "src/main.rs"

[dependencies]
memora = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
rmcp = { version = "0.12.0", features = ["server", "transport-io"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
