[package]
description = "Embeddable local-first memory engine"
edition = "2021"
exclude = [
    "server",
    "mcp",
    "data",
    ".cursor",
]
license = "MIT"
name = "memora"
readme = "README.md"
rust-version = "1.75"
version = "0.1.0"

[dependencies]
async-trait = "0.1"
hnsw_rs = "0.3"
jieba-rs = "0.7"
r2d2 = "0.8"
r2d2_sqlite = "0.31"
regex = "1"
fancy-regex = "0.14"
rusqlite_migration = "2.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dependencies.chrono]
default-features = false
features = [
    "clock",
    "std",
]
version = "0.4"

[dependencies.jni]
optional = true
version = "0.21"

[dependencies.moka]
features = ["future"]
version = "0.12"

# Desktop/server: native-tls (Windows schannel / macOS Security.framework /
# OpenSSL) so corporate MITM / internal CA certs in the system store work.
# Android keeps rustls to avoid openssl-sys in NDK builds.
[target.'cfg(not(target_os = "android"))'.dependencies.reqwest]
default-features = false
features = [
    "json",
    "native-tls",
    "gzip",
]
version = "0.12"

[target.'cfg(target_os = "android")'.dependencies.reqwest]
default-features = false
features = [
    "json",
    "rustls-tls",
    "gzip",
]
version = "0.12"

[dependencies.rusqlite]
features = [
    "bundled",
    "backup",
]
version = "0.37"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.tokio]
features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
]
version = "1"

[dependencies.uuid]
features = [
    "v7",
    "serde",
    "std",
]
version = "1"

[dependencies.zip]
default-features = false
features = ["deflate"]
version = "2"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

[dev-dependencies.tokio]
features = [
    "rt-multi-thread",
    "macros",
]
version = "1"

[features]
default = []
jni = ["dep:jni"]

[lib]
crate-type = [
    "rlib",
    "cdylib",
]
name = "memora"
path = "src/lib.rs"

[workspace]
default-members = ["."]
members = [
    ".",
    "server",
    "mcp",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true